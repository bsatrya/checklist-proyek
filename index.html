<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Proyek</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
        <!-- Header -->
        <header class="bg-emerald-600 text-white p-4 sticky top-0 z-10 shadow">
            <h1 class="text-lg font-bold">Checklist Proyek</h1>
            <p class="text-xs text-emerald-100">Laporan Harian Lapangan 7 Kavling</p>
        </header>

        <!-- Form Kontrol: Tanggal, Kavling & Lantai -->
        <div class="p-4 bg-emerald-50 border-b border-emerald-100 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">PILIH TANGGAL</label>
                <input type="date" id="reportDate" class="w-full p-2 border rounded-lg bg-white text-sm focus:ring-2 focus:ring-emerald-500">
            </div>
            
            <!-- Grid untuk Pilihan Kavling dan Lantai -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">PILIH KAVLING</label>
                    <select id="kavlingSelect" class="w-full p-2 border rounded-lg bg-white text-sm focus:ring-2 focus:ring-emerald-500">
                        <option value="Kav. 3">Kav. 3</option>
                        <option value="Kav. 4">Kav. 4</option>
                        <option value="Kav. 12a">Kav. 12a</option>
                        <option value="Kav. 14a">Kav. 14a</option>
                        <option value="Kav. 15a">Kav. 15a</option>
                        <option value="Kav. 19">Kav. 19</option>
                        <option value="Kav. 20-21">Kav. 20-21 (Gabung)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">PILIH LANTAI</label>
                    <select id="lantaiSelect" class="w-full p-2 border rounded-lg bg-white text-sm focus:ring-2 focus:ring-emerald-500">
                        <option value="LG">LG (Lower Ground)</option>
                        <option value="Lt.1">Lt. 1 (Lantai 1)</option>
                        <option value="Lt.2">Lt. 2 (Lantai 2)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Daftar Checklist Pekerjaan (24 Item Sesuai Google Sheets) -->
        <div class="p-4 flex-1 overflow-y-auto space-y-6">
            
            <!-- 1. PERSIAPAN & STRUKTUR BAWAH -->
            <div>
                <h3 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">1. PERSIAPAN & STRUKTUR BAWAH</h3>
                <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pembersihan & Pasang Bowplank" class="w-4 h-4 text-emerald-600 rounded">
                        <span>1. Pembersihan & Pasang Bowplank</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Galian Tanah & Urugan Pasir" class="w-4 h-4 text-emerald-600 rounded">
                        <span>2. Galian Tanah & Urugan Pasir</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Batu Kali / Aanstamping" class="w-4 h-4 text-emerald-600 rounded">
                        <span>3. Pasang Batu Kali / Aanstamping</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pengecoran Sloof" class="w-4 h-4 text-emerald-600 rounded">
                        <span>4. Pengecoran Sloof</span>
                    </label>
                </div>
            </div>

            <!-- 2. STRUKTUR ATAS & DINDING -->
            <div>
                <h3 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">2. STRUKTUR ATAS & DINDING</h3>
                <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pengecoran Kolom Praktis" class="w-4 h-4 text-emerald-600 rounded">
                        <span>5. Pengecoran Kolom Praktis</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Dinding Bata Ringan (Hebel) & Thinbed" class="w-4 h-4 text-emerald-600 rounded">
                        <span>6. Pasang Dinding Bata Ringan (Hebel) & Thinbed</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pengecoran Ring Balk" class="w-4 h-4 text-emerald-600 rounded">
                        <span>7. Pengecoran Ring Balk</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Plesteran & Acian Dinding" class="w-4 h-4 text-emerald-600 rounded">
                        <span>8. Plesteran & Acian Dinding</span>
                    </label>
                </div>
            </div>

            <!-- 3. ATAP & EKSTERIOR -->
            <div>
                <h3 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">3. ATAP & EKSTERIOR</h3>
                <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Rangka Baja Ringan" class="w-4 h-4 text-emerald-600 rounded">
                        <span>9. Pasang Rangka Baja Ringan</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Alas Plywood/OSB Board" class="w-4 h-4 text-emerald-600 rounded">
                        <span>10. Pasang Alas Plywood/OSB Board</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Atap Bitumen & Flashing" class="w-4 h-4 text-emerald-600 rounded">
                        <span>11. Pasang Atap Bitumen & Flashing</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Conwood Fasad / Lisplang" class="w-4 h-4 text-emerald-600 rounded">
                        <span>12. Pasang Conwood Fasad / Lisplang</span>
                    </label>
                </div>
            </div>

            <!-- 4. MEP (UTILITAS) -->
            <div>
                <h3 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">4. MEP (UTILITAS)</h3>
                <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Instalasi Pipa Air Bersih & Kotor (Multi Kamar Mandi)" class="w-4 h-4 text-emerald-600 rounded">
                        <span>13. Instalasi Pipa Air Bersih & Kotor</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Instalasi Pipa & Cable NYM 2.5mm Water Heater" class="w-4 h-4 text-emerald-600 rounded">
                        <span>14. Instalasi Pipa & Cable NYM Water Heater</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Bobokan & Pemasangan Exhaust Fan Tiap Kamar Mandi" class="w-4 h-4 text-emerald-600 rounded">
                        <span>15. Bobokan & Pemasangan Exhaust Fan</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Box MCB & Sakelar" class="w-4 h-4 text-emerald-600 rounded">
                        <span>16. Pasang Box MCB & Sakelar</span>
                    </label>
                </div>
            </div>

            <!-- 5. FINISHING & ARSITEKTUR -->
            <div>
                <h3 class="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">5. FINISHING & ARSITEKTUR</h3>
                <div class="space-y-2 bg-gray-50 p-3 rounded-lg border">
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Plafon & Lis Plafon" class="w-4 h-4 text-emerald-600 rounded">
                        <span>17. Pasang Plafon & Lis Plafon</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Kusen, Pintu, & Jendela" class="w-4 h-4 text-emerald-600 rounded">
                        <span>18. Pasang Kusen, Pintu, & Jendela</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Keramik/Granit Lantai & Kamar Mandi" class="w-4 h-4 text-emerald-600 rounded">
                        <span>19. Pasang Keramik/Granit Lantai & KM</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pasang Sanitary (Kloset, Shower, Sink)" class="w-4 h-4 text-emerald-600 rounded">
                        <span>20. Pasang Sanitary (Kloset, Shower, Sink)</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pengecatan (Interior, Eksterior, Plafon)" class="w-4 h-4 text-emerald-600 rounded">
                        <span>21. Pengecatan (Interior, Eksterior, Plafon)</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Penataan & Pemadatan Tanah Area Carport Depan" class="w-4 h-4 text-emerald-600 rounded">
                        <span>22. Penataan & Pemadatan Tanah Carport</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pemasangan Dinding Pagar Pembatas Samping (Batu)" class="w-4 h-4 text-emerald-600 rounded">
                        <span>23. Pemasangan Pagar Pembatas Samping</span>
                    </label>
                    <label class="flex items-center space-x-3 text-sm">
                        <input type="checkbox" data-task="Pembersihan Akhir & Punch List" class="w-4 h-4 text-emerald-600 rounded">
                        <span>24. Pembersihan Akhir & Punch List</span>
                    </label>
                </div>
            </div>

            <!-- Catatan Lapangan -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">CATATAN LAPANGAN / KENDALA</label>
                <textarea id="notes" rows="2" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" placeholder="Tulis kendala cuaca atau material..."></textarea>
            </div>
        </div>

        <!-- Tombol Simpan -->
        <div class="p-4 bg-white border-t sticky bottom-0">
            <button id="saveBtn" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl shadow hover:bg-emerald-700 transition">
                Simpan & Kirim ke Google Sheets
            </button>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        document.getElementById('reportDate').valueAsDate = new Date();
    </script>
    <script src="app.js"></script>
</body>
</html>
